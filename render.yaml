# Déploiement du backend QR Studio sur Render (Blueprint).
# Les fichiers sont stockés dans PostgreSQL (Neon) : le disque de Render est
# effacé à chaque déploiement, et le serveur refuse de démarrer sans base.
services:
  - type: web
    name: qr-studio-api
    runtime: python
    plan: free
    # Même région que la base Neon (AWS eu-central-1, Francfort).
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Le schéma des comptes et des QR Codes est migré avant chaque démarrage.
    startCommand: alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Chaîne de connexion Neon, à saisir dans le tableau de bord Render
      # (jamais dans Git).
      - key: DATABASE_URL
        sync: false
      # Adresse de la PWA (ex. https://qr-studio-web.onrender.com), autorisée
      # à appeler l'API depuis le navigateur. À saisir dans le tableau de bord.
      - key: QR_STUDIO_CORS_ORIGINS
        sync: false
      # Signature des jetons de session, générée par Render à la création
      # du service. La changer déconnecte tous les utilisateurs.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Connexion Google/Facebook, à saisir dans le tableau de bord. Vides :
      # ces connexions répondent 503 (email et mot de passe restent
      # disponibles).
      # Client OAuth « Application Web » (public, pas un secret) : audience
      # acceptée des ID tokens Google.
      - key: GOOGLE_CLIENT_ID
        value: 788583080594-grau0tdej4k2bpokotf94dkg8c7donm7.apps.googleusercontent.com
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false

  # PWA (Flutter web), pour les utilisateurs iOS : ouverte dans Safari puis
  # « Partager › Sur l'écran d'accueil ». Site statique servi par le CDN de
  # Render, qui ne s'endort pas.
  - type: web
    name: qr-studio-web
    runtime: static
    # Render ne fournit pas Flutter : la version du projet est installée
    # dans $HOME/flutter, que le cache de build de Render conserve. Elle est
    # réutilisée si c'est la bonne version, sinon réinstallée.
    buildCommand: >-
      if [ "$(git -C "$HOME/flutter" describe --tags --exact-match 2>/dev/null)"
      != "$FLUTTER_VERSION" ]; then
      rm -rf "$HOME/flutter" &&
      git clone --depth 1 --branch "$FLUTTER_VERSION"
      https://github.com/flutter/flutter.git "$HOME/flutter"; fi &&
      "$HOME/flutter/bin/flutter" build web --release
      --dart-define=QR_STUDIO_API_URL="$QR_STUDIO_API_URL"
      --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
      --dart-define=FACEBOOK_APP_ID="$FACEBOOK_APP_ID"
    staticPublishPath: build/web
    # Le backend n'influe pas sur la PWA : pas de rebuild pour lui.
    buildFilter:
      ignoredPaths:
        - backend/**
        - android/**
        - ios/**
    headers:
      # Fichiers d'entrée jamais mis en cache : une nouvelle version arrive
      # dès la prochaine ouverture (iOS garde sinon l'ancienne longtemps).
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: FLUTTER_VERSION
        value: 3.44.0
      - key: QR_STUDIO_API_URL
        value: https://qr-studio-api-q71x.onrender.com
      # Identifiants publics (pas des secrets) des connexions Google et
      # Facebook ; vides, les boutons ne sont pas affichés.
      - key: GOOGLE_CLIENT_ID
        value: 788583080594-grau0tdej4k2bpokotf94dkg8c7donm7.apps.googleusercontent.com
      - key: FACEBOOK_APP_ID
        sync: false
