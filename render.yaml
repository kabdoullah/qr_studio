# Déploiement du backend QR Studio sur Render (Blueprint).
# Les fichiers sont stockés dans PostgreSQL (Neon) : le disque de Render est
# effacé à chaque déploiement, et le serveur refuse de démarrer sans base.
services:
  - type: web
    name: qr-studio-api
    runtime: python
    plan: free
    # Même région que la base Neon (AWS eu-central-1, Francfort).
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Chaîne de connexion Neon, à saisir dans le tableau de bord Render
      # (jamais dans Git).
      - key: DATABASE_URL
        sync: false
